name: Test

# End-to-end test: the binary built in this run sets up real AEM instances in a scaffolded project, once per task runner and AEM version, each on the newest Java it supports.
# Too heavy for every push: run on demand from any branch, and before every release (called by release-perform.yml).
# AEM distributions come from S3, read through the GitHub OIDC role in the repository variables AWS_ROLE_ARN, AWS_REGION and AWS_S3_BUCKET_NAME.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.6

      - name: Build
        run: mise run build

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aem
          path: bin/aem
          retention-days: 3

  test:
    name: Test (AEM ${{ matrix.target.aem }}, Java ${{ matrix.target.java }}, ${{ matrix.runner.name }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # assume the AWS role through GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: mise
            task: ./bin/mise run
            aem: ./bin/mise exec -- aem
          - name: task
            task: sh taskw
            aem: sh aemw
        # Each AEM on the newest Java it supports
        target:
          - aem: SDK
            dist_prefix: aem/cloud/aem-sdk-
            java: '25'
            java_mise: temurin-25.0.5+8.0.LTS
            java_url: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
          - aem: '6.6'
            dist_prefix: aem/on-prem/cq-quickstart-6.6.
            java: '21'
            java_mise: temurin-21.0.13+9.0.LTS
            java_url: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz
    env:
      # Runner mise: Java version override, project config trusted, GitHub API calls authenticated
      MISE_JAVA_VERSION: ${{ matrix.target.java_mise }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      GITHUB_TOKEN: ${{ github.token }}
      # Runner Task: AEM Compose from PATH instead of a download, Java version override
      AEM_CLI_VERSION: installed
      AEM_VENDOR_JAVA_DOWNLOAD_URL: ${{ matrix.target.java_url }}
    steps:
      - name: Check AWS variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME }}
        run: |
          missing=""
          for name in AWS_ROLE_ARN AWS_REGION AWS_S3_BUCKET_NAME; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository variables missing:$missing. Set them to the AWS role (GitHub OIDC) and the S3 bucket holding the AEM distributions."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: aem
          path: ${{ runner.temp }}/aemc/bin

      - name: Install binary
        run: |
          chmod +x "$RUNNER_TEMP/aemc/bin/aem"
          echo "$RUNNER_TEMP/aemc/bin" >> "$GITHUB_PATH"

      - name: Scaffold project
        run: |
          aem version
          aem project scaffold --project-kind instance --runner ${{ matrix.runner.name }}

      - name: Use built binary in project run by mise
        if: matrix.runner.name == 'mise'
        run: |
          cat > mise.local.toml <<EOF
          [settings]
          lockfile = false

          [tools]
          "github:wttech/aemc" = "path:$RUNNER_TEMP/aemc"
          EOF

      - name: Download AEM distribution
        env:
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME }}
          DIST_PREFIX: ${{ matrix.target.dist_prefix }}
        run: |
          echo "AEM_PUBLISH_ACTIVE=false" >> .env
          mkdir -p aem/home/lib
          dist_dir=$(dirname "$DIST_PREFIX")
          dist_file=$(aws s3 ls "s3://$AWS_S3_BUCKET_NAME/$DIST_PREFIX" | awk '{print $4}' | sort -V | tail -n 1)
          if [ -z "$dist_file" ]; then
            echo "::error::No AEM distribution matching 's3://$AWS_S3_BUCKET_NAME/$DIST_PREFIX' found"
            exit 1
          fi
          echo "Downloading AEM distribution '$dist_dir/$dist_file'"
          aws s3 cp --no-progress --only-show-errors "s3://$AWS_S3_BUCKET_NAME/$dist_dir/$dist_file" "aem/home/lib/$dist_file"
          aws s3 cp --no-progress --only-show-errors "s3://$AWS_S3_BUCKET_NAME/aem/on-prem/license.properties" aem/home/lib/license.properties

      - name: Init
        run: ${{ matrix.runner.task }} init

      - name: Start
        run: ${{ matrix.runner.task }} start

      - name: Status
        run: ${{ matrix.runner.task }} status

      - name: Backup
        run: ${{ matrix.runner.aem }} instance backup perform --skip-space-check

      - name: Status after backup
        run: ${{ matrix.runner.task }} status

      - name: Stop
        run: ${{ matrix.runner.task }} stop

      - name: Upload AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aem-logs-${{ matrix.runner.name }}-aem-${{ matrix.target.aem }}-java-${{ matrix.target.java }}
          path: aem/home/var/instance/*/crx-quickstart/logs/
          if-no-files-found: ignore
          retention-days: 7
