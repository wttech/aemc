[tools]
go = "1.25.14"
"go:github.com/mgechev/revive" = "1.15.0"

[env]
# Env files of the development AEM project; later files override earlier ones (same order as AEM Compose loads them)
AEM_ENV = "{{ get_env(name='AEM_ENV', default='local') }}"
AEM_INSTANCE_PROCESSING_MODE = "auto"
AEM_JAVA_ENABLED = "true"
_.file = [
  "{{ env.AEM_ENV }}.env",  # VCS-tracked, env-specific
  ".env.{{ env.AEM_ENV }}", # VCS-ignored, env-specific
  ".env",                   # VCS-ignored, user-specific
]

[vars]
build_tags = "timetzdata"
# Stamp the binary with its Git version, commit and commit date
ldflags = "-s -w -X main.appVersion={{ exec(command='git describe --tags 2>/dev/null || git rev-parse HEAD') }} -X main.appCommit={{ exec(command='git rev-parse HEAD') }} -X main.appCommitDate={{ exec(command=\"git log -1 --date=format:'%Y-%m-%dT%H:%M:%S' --format=%cd\") }}"

[task_config]
includes = ["tasks/aem.toml", "tasks"]

[tasks.all]
description = "Run deps, test, vet, fmt, lint, install"
run = [
  { task = "deps" },
  { task = "test" },
  { task = "vet" },
  { task = "fmt" },
  { task = "lint" },
  { task = "install" },
]

[tasks.check]
description = "The gate before every merge, the same locally and in CI: tidy dependencies, tests, vet, formatting, lint and build"
run = [
  { task = "deps:check" },
  { task = "test" },
  { task = "vet" },
  { task = "fmt:check" },
  { task = "lint" },
  { task = "build" },
]

[tasks.deps]
description = "Tidy Go module dependencies"
run = "go mod tidy"

[tasks."deps:check"]
description = "Check that Go module dependencies are tidy"
run = "go mod tidy -diff"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks."test:int"]
description = "Run integration tests (require running AEM)"
run = "go test -count=1 -tags=int_test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format code"
run = "gofmt -l -w ."

[tasks."fmt:check"]
description = "Check that code is formatted"
run = 'files=$(gofmt -l .); if [ -n "$files" ]; then echo "Not formatted, run mise run fmt:"; echo "$files"; exit 1; fi'

[tasks.lint]
description = "Run linter"
run = "revive -config revive.toml -formatter friendly ./..."

[tasks.build]
description = "Build the binary"
run = 'go build -tags "{{ vars.build_tags }}" -ldflags "{{ vars.ldflags }}" -o bin/aem ./cmd/aem'

[tasks."build:other"]
description = "Build binaries for other platforms"
run = [
  'GOARCH=amd64 GOOS=darwin  go build -tags "{{ vars.build_tags }}" -ldflags "{{ vars.ldflags }}" -o bin/aem.darwin ./cmd/aem',
  'GOARCH=amd64 GOOS=linux   go build -tags "{{ vars.build_tags }}" -ldflags "{{ vars.ldflags }}" -o bin/aem.linux  ./cmd/aem',
  'GOARCH=amd64 GOOS=windows go build -tags "{{ vars.build_tags }}" -ldflags "{{ vars.ldflags }}" -o bin/aem.exe    ./cmd/aem',
]

[tasks.install]
description = "Install the binary"
run = 'go install -tags "{{ vars.build_tags }}" -ldflags "{{ vars.ldflags }}" ./cmd/aem'

[tasks.clean]
description = "Clean build artifacts"
run = ["go clean", "rm -fr bin"]
